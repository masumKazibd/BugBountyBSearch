<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HI | Advanced Bug Bounty Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar">
            <h5 class="text-white mb-4">FILTERS</h5>
            
            <div class="filter-group">
                <span class="filter-label">Reward Type</span>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="bounty" id="checkPaid">
                    <label class="form-check-label" for="checkPaid">Bug Bounty</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="vdp" id="checkVDP">
                    <label class="form-check-label" for="checkVDP">VDP Only</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="swag" id="checkSwag">
                    <label class="form-check-label" for="checkSwag">Swag Available</label>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-label">Platform</span>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="hackerone" id="h1">
                    <label class="form-check-label" for="h1">HackerOne</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="bugcrowd" id="bc">
                    <label class="form-check-label" for="bc">Bugcrowd</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="intigriti" id="int">
                    <label class="form-check-label" for="int">Intigriti</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="selfProgram" id="int">
                    <label class="form-check-label" for="int">Self Program</label>
                </div>
            </div>
            
            <button class="btn btn-outline-warning btn-sm w-100 mt-3" id="clearFilters">Clear All</button>
        </div>
        <div class="col-md-9 col-lg-10 search-area">
            <div class="sticky-header">
                <h2 class="hi-header mb-3">HIDDEN INVESTIGATIONS <span style="color:white">DB</span></h2>
        <input type="text" id="searchInput" class="search-box" placeholder="Search by company, domain, or program URL...">
        
        <div id="statusMessage" class="mt-2 small text-warning">Connecting to Data Source...</div>
    </div>
    
    <div id="results" class="mt-2"></div>
</div>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    const jsonSources = [
        'https://raw.githubusercontent.com/masumKazibd/BugBountyBSearch/main/data.json',
        // 'https://raw.githubusercontent.com/masumKazibd/BugBountyBSearch/main/data_part2.json',
    ];

    let programs = [];

    async function loadAllSources() {
        try {
            const fetchPromises = jsonSources.map(url => 
                $.ajax({
                    url: url,
                    dataType: 'json',
                    cache: false
                })
            );

            const allDataSets = await Promise.all(fetchPromises);

            allDataSets.forEach(data => {
                if (data.programs && Array.isArray(data.programs)) {
                    programs = programs.concat(data.programs);
                }
            });

            $('#statusMessage').hide();
            console.log("Total programs loaded: " + programs.length);

            renderPrograms(programs); 

        } catch (error) {
            console.error("Data loading error:", error);
            $('#statusMessage').html('<span class="text-danger">Failed to sync one or more data sources. Check your GitHub links!</span>');
        }
    }

    loadAllSources();
    
    function filterData() {
        let query = $('#searchInput').val().toLowerCase();
        let selectedPaid = $('#checkPaid').is(':checked');
        let selectedVDP = $('#checkVDP').is(':checked');
        let selectedSwag = $('#checkSwag').is(':checked');
        
        let selectedPlatforms = [];
        if($('#h1').is(':checked')) selectedPlatforms.push('hackerone');
        if($('#bc').is(':checked')) selectedPlatforms.push('bugcrowd');
        if($('#int').is(':checked')) selectedPlatforms.push('intigriti');

        let filtered = programs.filter(p => {
            let matchesSearch = p.name.toLowerCase().includes(query) || 
                                p.url.toLowerCase().includes(query) ||
                                (p.domains && p.domains.some(d => d.toLowerCase().includes(query)));
            
            let matchesType = true;
            if(selectedPaid && !p.bounty) matchesType = false;
            if(selectedVDP && p.bounty) matchesType = false;
            if(selectedSwag && !p.swag) matchesType = false;

            let matchesPlatform = true;
            if(selectedPlatforms.length > 0) {
                matchesPlatform = selectedPlatforms.some(platform => p.url.toLowerCase().includes(platform));
            }

            return matchesSearch && matchesType && matchesPlatform;
        });

        renderPrograms(filtered);
    }
    
    function renderPrograms(dataList) {
        let html = '';
        
        dataList.forEach((p, pIndex) => {
            // Badge logic
            let badge = p.bounty ? '<span class="badge badge-hi bg-success me-2">PAID</span>' : '<span class="badge badge-hi bg-secondary me-2">VDP</span>';
            let swag = p.swag ? '<span class="badge badge-hi bg-danger">SWAG</span>' : '';
            
            // Extract domain for favicon API
            let domain = "";
            try { 
                domain = new URL(p.url).hostname; 
            } catch(e) {
                 domain = "";
            }

            let faviconUrl = `https://www.google.com/s2/favicons?sz=64&domain=${domain}`;

            // Generate Numbered Scope List with visibility controls
            let scopeHtml = '';
            if (p.domains && p.domains.length > 0) {
                scopeHtml = `<ul class="scope-list" id="scope-list-${pIndex}">`;
                p.domains.forEach((domain, dIndex) => {
                    let fullUrl = domain.startsWith('http') ? domain : `http://${domain}`;
                    // Hide items beyond the initial 10
                    let hiddenClass = dIndex >= 10 ? 'hidden' : '';
                    scopeHtml += `
                        <li class="scope-item ${hiddenClass}">
                            <span class="scope-number">${dIndex + 1}.</span>
                            <a href="${fullUrl}" target="_blank" class="scope-link">${domain}</a>
                        </li>`;
                });
                scopeHtml += '</ul>';
                if (p.domains.length > 10) {
                    scopeHtml += `
                        <div class="scope-controls" id="controls-${pIndex}">
                            <button class="btn-scope-control" onclick="loadMoreScopes(${pIndex}, 10)">Load Next 10</button>
                            <button class="btn-scope-control" onclick="loadMoreScopes(${pIndex}, 'all')">Show All</button>
                        </div>`;
                }
            } else {
                scopeHtml = '<div class="text-muted small mt-2 fst-italic">No specific domains listed</div>';
            }

            html += `
                <div class="program-card">
                    <div class="small text-secondary mb-2" style="font-family: monospace; opacity: 0.6;">Source: ${p.url}</div>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="title-wrapper">
                            <img src="${faviconUrl}" class="program-icon" alt="icon" onerror="this.src='https://www.google.com/s2/favicons?sz=64&domain=github.com'">
                            <a href="${p.url}" target="_blank" class="program-name">${p.name}</a>
                        </div>
                        <div>${badge}${swag}</div>
                    </div>

                    <div class="mt-4">
                        <span class="filter-label" style="font-size: 0.7rem; opacity: 0.8; color: var(--hi-gold);">
                            IN-SCOPE ASSET LIST (${p.domains.length}):
                        </span>
                        ${scopeHtml}
                    </div>
                </div>`;
        });
        
        $('#results').html(html || '<div class="text-center mt-5 text-muted">No programs match these filters.</div>');
    }

    $('.filter-check, #searchInput').on('input change', filterData);
    
    $('#clearFilters').click(function() {
        $('.filter-check').prop('checked', false);
        $('#searchInput').val('');
        renderPrograms(programs);
    });
});


function loadMoreScopes(pIndex, count) {
    const list = $(`#scope-list-${pIndex}`);
    const hiddenItems = list.find('.scope-item.hidden');

    if (count === 'all') {
        // Show all hidden assets at once
        hiddenItems.removeClass('hidden');
        $(`#controls-${pIndex}`).hide();
    } else {
        // Show only the next 10 assets
        hiddenItems.slice(0, count).removeClass('hidden');

        // If no more assets are hidden, remove the control buttons
        if (list.find('.scope-item.hidden').length === 0) {
            $(`#controls-${pIndex}`).hide();
        }
    }
}
</script>
</body>
</html>
