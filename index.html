<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HI | Advanced Bug Bounty Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --hi-gold: #E7B80A;
            --hi-red: #CE4255;
            --hi-bg: #000000;
            --hi-card: #0d0d0d;
            --hi-border: #1a1a1a;
        }
        body { 
            background-color: var(--hi-bg); 
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            background-image: linear-gradient(rgba(231, 184, 10, 0.02) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(231, 184, 10, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        
        /* Sidebar Styling */
        .sidebar {
            background: var(--hi-card);
            border-right: 1px solid var(--hi-border);
            height: 100vh;
            padding: 25px;
            position: sticky;
            top: 0;
        }
        .filter-group { margin-bottom: 25px; }
        .filter-label { color: var(--hi-gold); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 15px; display: block; }
        
        /* Custom Checkbox */
        .form-check-input:checked { background-color: var(--hi-red); border-color: var(--hi-red); }
        .form-check-label { font-size: 0.9rem; color: #ccc; cursor: pointer; }

        /* Search & Cards */
        .search-area { padding: 40px; }
        .hi-header { color: var(--hi-gold); font-weight: 900; letter-spacing: 2px; }
        .search-box {
            background: var(--hi-card);
            border: 1px solid var(--hi-border);
            border-bottom: 2px solid var(--hi-gold);
            padding: 12px 20px;
            width: 100%;
            color: white;
            border-radius: 4px;
        }
        .program-card {
            background: var(--hi-card);
            border: 1px solid var(--hi-border);
            border-left: 4px solid var(--hi-gold);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 4px;
            transition: 0.3s;
        }
        .program-card:hover { border-left-color: var(--hi-red); transform: translateX(5px); }
        .program-name { color: var(--hi-gold); font-size: 1.4rem; text-decoration: none; font-weight: bold; }
        .badge-hi { font-size: 0.7rem; padding: 5px 10px; border-radius: 2px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar">
            <h5 class="text-white mb-4">FILTERS</h5>
            
            <div class="filter-group">
                <span class="filter-label">Reward Type</span>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="bounty" id="checkPaid">
                    <label class="form-check-label" for="checkPaid">Cash Bounty</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="vdp" id="checkVDP">
                    <label class="form-check-label" for="checkVDP">VDP Only</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="swag" id="checkSwag">
                    <label class="form-check-label" for="checkSwag">Swag Available</label>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-label">Platform</span>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="hackerone" id="h1">
                    <label class="form-check-label" for="h1">HackerOne</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="bugcrowd" id="bc">
                    <label class="form-check-label" for="bc">Bugcrowd</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input filter-check" type="checkbox" value="intigriti" id="int">
                    <label class="form-check-label" for="int">Intigriti</label>
                </div>
            </div>
            
            <button class="btn btn-outline-warning btn-sm w-100 mt-3" id="clearFilters">Clear All</button>
        </div>

        <div class="col-md-9 col-lg-10 search-area">
            <h2 class="hi-header mb-4">HIDDEN INVESTIGATIONS <span style="color:white">DB</span></h2>
            <input type="text" id="searchInput" class="search-box" placeholder="Search by company, domain, or program URL...">
            
            <div id="results" class="mt-4">
                <div class="text-muted">Loading database...</div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        let programs = [];

        // Fetch Data from data.json
        $.getJSON('data.json', function(data) {
            programs = data.programs;
            renderPrograms(programs); // Initial render
        });

        // Main filtering function
        function filterData() {
            let query = $('#searchInput').val().toLowerCase();
            let selectedPaid = $('#checkPaid').is(':checked');
            let selectedVDP = $('#checkVDP').is(':checked');
            let selectedSwag = $('#checkSwag').is(':checked');
            
            // Get selected platforms
            let selectedPlatforms = [];
            if($('#h1').is(':checked')) selectedPlatforms.push('hackerone');
            if($('#bc').is(':checked')) selectedPlatforms.push('bugcrowd');
            if($('#int').is(':checked')) selectedPlatforms.push('intigriti');

            let filtered = programs.filter(p => {
                // Search match
                let matchesSearch = p.name.toLowerCase().includes(query) || 
                                    p.url.toLowerCase().includes(query) ||
                                    (p.domains && p.domains.some(d => d.toLowerCase().includes(query)));
                
                // Bounty/VDP filter
                let matchesType = true;
                if(selectedPaid && !p.bounty) matchesType = false;
                if(selectedVDP && p.bounty) matchesType = false;
                if(selectedSwag && !p.swag) matchesType = false;

                // Platform filter
                let matchesPlatform = true;
                if(selectedPlatforms.length > 0) {
                    matchesPlatform = selectedPlatforms.some(platform => p.url.toLowerCase().includes(platform));
                }

                return matchesSearch && matchesType && matchesPlatform;
            });

            renderPrograms(filtered);
        }

        function renderPrograms(dataList) {
            let html = '';
            dataList.forEach(p => {
                let badge = p.bounty ? '<span class="badge badge-hi bg-success me-2">PAID</span>' : '<span class="badge badge-hi bg-secondary me-2">VDP</span>';
                let swag = p.swag ? '<span class="badge badge-hi bg-danger">SWAG</span>' : '';
                let scope = p.domains.length > 0 ? p.domains.slice(0, 3).join(', ') : 'Check URL for scope';

                html += `
                    <div class="program-card">
                        <div class="small text-secondary mb-1">${p.url}</div>
                        <div class="d-flex justify-content-between">
                            <a href="${p.url}" target="_blank" class="program-name">${p.name}</a>
                            <div>${badge}${swag}</div>
                        </div>
                        <div class="mt-2 small text-white-50">Scope highlights: ${scope}</div>
                    </div>`;
            });
            $('#results').html(html || '<div class="text-center mt-5">No programs match these filters.</div>');
        }

        // Events
        $('.filter-check, #searchInput').on('input change', filterData);
        $('#clearFilters').click(function() {
            $('.filter-check').prop('checked', false);
            $('#searchInput').val('');
            renderPrograms(programs);
        });
    });
</script>
</body>
</html>
